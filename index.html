<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kumar Kishan — Home</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="cur"><div id="cd"></div><div id="cr"></div></div>
<!-- VIDEO BACKGROUND -->
<div class="vid-bg">
  <video id="bgVid" autoplay muted loop playsinline preload="auto">
    <!-- ★ Change filename to match your video file ★ -->
    <source src="introduction.mp4" type="video/mp4">
  </video>
  <div class="vid-overlay"></div>
  <div class="vid-vignette"></div>
</div>

<div class="grid-ov"></div>
<canvas id="cv"></canvas>

<nav>
  <div class="logo">KK</div>
  <ul class="nl" id="nl">
    <li><a href="index.html" class="active" onclick="cm()">Home</a></li>
    <li><a href="about.html" onclick="cm()">About</a></li>
    <li><a href="projects.html" onclick="cm()">Projects</a></li>
    <li><a href="contact.html" onclick="cm()">Contact</a></li>
  </ul>
  <div class="nt" id="nt" onclick="tm()"><span></span><span></span><span></span></div>
</nav>

<div class="hero">
  <div class="hero-inner">
    <div class="h-eyebrow">Wellcome to my &mdash; World</div>
    <div class="h-ctas">
      <a href="about.html" class="bg">about me</a>
      <a href="contact.html" class="bo">Get In Touch</a>
    </div>
  </div>
</div>

<div class="h-side">
  <div><div class="stat-n">4+</div><div class="stat-l">Years</div></div>
  <div class="stat-div"></div>
  <div><div class="stat-n">5+</div><div class="stat-l">Projects</div></div>
  <div class="stat-div"></div>
  <div><div class="stat-n">10+</div><div class="stat-l">Clients</div></div>
</div>

<div class="h-scroll"><span>Explore</span><div class="sline"></div></div>

<script>
// cursor
const CD=document.getElementById('cd'),CR=document.getElementById('cr');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
document.querySelectorAll('a,button').forEach(el=>{
  el.addEventListener('mouseenter',()=>document.body.classList.add('hov'));
  el.addEventListener('mouseleave',()=>document.body.classList.remove('hov'));
});
(function loop(){CD.style.cssText=`left:${mx}px;top:${my}px`;rx+=(mx-rx)*.11;ry+=(my-ry)*.11;CR.style.cssText=`left:${rx}px;top:${ry}px`;requestAnimationFrame(loop)})();

// nav
function tm(){document.getElementById('nl').classList.toggle('open')}
function cm(){document.getElementById('nl').classList.remove('open')}

const bgVid = document.getElementById('bgVid');
bgVid.muted = true;
bgVid.play();

let unlocked = false;

function unlock() {
  if (unlocked) return;
  unlocked = true;
  bgVid.muted = false;
  bgVid.volume = 1.0;
  bgVid.play();
  window.removeEventListener('wheel', unlock);
  window.removeEventListener('touchmove', unlock);
  window.removeEventListener('touchstart', unlock);
  window.removeEventListener('touchend', unlock);
  window.removeEventListener('click', unlock);
  window.removeEventListener('animationstart', unlock);
  window.addEventListener('mousemove', unlock);
  window.addEventListener('mouseenter', unlock);
}

window.addEventListener('wheel', unlock);
window.addEventListener('touchmove', unlock);
window.addEventListener('touchstart', unlock);
window.addEventListener('touchend', unlock);
window.addEventListener('click', unlock);
window.addEventListener('animationstart', unlock);
window.addEventListener('mousemove', unlock);
window.addEventListener('mouseenter', unlock);

document.addEventListener('visibilitychange', () => {
  document.hidden ? bgVid.pause() : bgVid.play();
});

// Hide video block if file fails to load
bgVid.addEventListener('error', () => {
  document.querySelector('.vid-bg').style.display = 'none';
});

// stars
(function(){
  const cv=document.getElementById('cv'),c=cv.getContext('2d');
  let W,H,stars=[],M={x:null,y:null};
  function rsz(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
  rsz();window.addEventListener('resize',()=>{rsz();init()});
  document.addEventListener('mousemove',e=>{M.x=e.clientX;M.y=e.clientY});
  class S{
    constructor(){this.rst()}
    rst(){this.x=Math.random()*W;this.y=Math.random()*H;this.r=Math.random()*1.6+.3;this.a=Math.random()*Math.PI*2;this.sp=Math.random()*.2+.07;this.op=Math.random()*.55+.1;this.gold=Math.random()>.55}
    go(){
      this.x+=Math.cos(this.a)*this.sp;this.y+=Math.sin(this.a)*this.sp;this.a+=(Math.random()-.5)*.015;
      if(M.x){const dx=this.x-M.x,dy=this.y-M.y,d=Math.sqrt(dx*dx+dy*dy);if(d<80){this.x+=dx/d*.7;this.y+=dy/d*.7}}
      if(this.x<-8||this.x>W+8||this.y<-8||this.y>H+8)this.rst();
    }
    draw(){c.beginPath();c.arc(this.x,this.y,this.r,0,Math.PI*2);c.fillStyle=this.gold?`rgba(201,168,76,${this.op})`:`rgba(210,210,240,${this.op*.3})`;c.fill()}
  }
  function init(){const n=Math.min(160,Math.floor(W*H/8000));stars=Array.from({length:n},()=>new S())}
  init();
  function conn(){for(let i=0;i<stars.length;i++)for(let j=i+1;j<stars.length;j++){const dx=stars[i].x-stars[j].x,dy=stars[i].y-stars[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<90){c.beginPath();c.moveTo(stars[i].x,stars[i].y);c.lineTo(stars[j].x,stars[j].y);c.strokeStyle=`rgba(201,168,76,${(1-d/90)*.055})`;c.lineWidth=.5;c.stroke()}}}
  (function loop(){c.clearRect(0,0,W,H);conn();stars.forEach(s=>{s.go();s.draw()});requestAnimationFrame(loop)})();
})();


</script>
</body>
</html>
